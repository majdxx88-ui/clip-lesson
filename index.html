<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131B30">
<title>مقطع ودرس</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131B30'/%3E%3Crect x='12' y='36' width='40' height='12' rx='3' fill='%23FFD23F'/%3E%3Crect x='12' y='18' width='28' height='7' rx='3' fill='%23F4F6FB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: cool paper everywhere; the one loud surface is the navy prompter that carries
     the English words, with a highlighter mark that follows the speaker. */
  --paper:#EDF0F5;
  --surface:#FFFFFF;
  --ink:#141C30;
  --muted:#5B657A;
  --line:#D3D9E4;
  --prompter:#131B30;
  --prompter-2:#1C2643;
  --prompter-ink:#F4F6FB;
  --prompter-muted:#8E9BB8;
  --mark:#FFD23F;
  --mark-ink:#201800;
  --good:#1C8754;
  --bad:#C23B30;
  --font-ar:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --font-head:"Noto Kufi Arabic","IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --font-en:"Newsreader","Iowan Old Style",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0B111E; --surface:#141C2E; --ink:#E8ECF5; --muted:#97A2B8; --line:#273249;
    --prompter:#141D36; --prompter-2:#1E2A4B; --good:#49C48A; --bad:#F2776C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ar);font-size:17px;line-height:1.75}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none !important}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-inline-size:1320px;margin:0 auto;padding:12px 20px;block-size:58px}
.brand{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:1.2rem;color:var(--ink)}
.brand .hl{background:var(--mark);color:var(--mark-ink);padding:0 .35em;border-radius:5px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 16px;cursor:pointer;font-weight:500}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
main{max-inline-size:1320px;margin:0 auto;padding:4px 20px 72px}
body.fixed{overflow:hidden}
body.fixed main{padding-block-end:0}

h1{font-family:var(--font-head);font-weight:700;font-size:clamp(1.5rem,1.15rem + 1.7vw,2.2rem);line-height:1.4;margin:0;text-wrap:balance}
h2{font-family:var(--font-head);font-weight:700;font-size:1.1rem;margin:0}
.lede{margin:0;color:var(--muted);max-inline-size:58ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;text-decoration:none;line-height:1.5}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:600}
.msg{color:var(--muted);font-size:.92rem;margin:0}
.msg.err{color:var(--bad)}
.en-line{display:block;direction:ltr;text-align:left;font-family:var(--font-en);font-weight:600;font-size:1.05rem}
.pill{display:inline-block;background:var(--mark);color:var(--mark-ink);border-radius:999px;padding:0 9px;font-size:.75rem;font-weight:600;margin-inline-end:6px}
.prompter{background:var(--prompter);color:var(--prompter-ink);border-radius:16px}

/* ---------- Home ---------- */
.home{display:grid;gap:36px;grid-template-columns:minmax(0,1fr);max-inline-size:1120px;margin:0 auto;padding-block-start:10px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start;gap:44px}}
.hero{display:grid;gap:16px}
.linkbox{display:flex;flex-wrap:wrap;gap:10px;padding:14px}
.linkbox:focus-within{outline:2px solid var(--mark);outline-offset:2px}
#f-url{flex:1;min-inline-size:200px;background:transparent;border:0;outline:0;color:var(--prompter-ink);font-family:var(--font-en);font-size:1.2rem;padding:8px 10px;text-align:left}
#f-url::placeholder{color:var(--prompter-muted)}
.linkbox .btn{padding:10px 22px}
.setup{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;display:grid;gap:12px}
.setup ol{margin:0;padding-inline-start:22px;display:grid;gap:6px;color:var(--muted)}
.setup .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.setup details summary{cursor:pointer;font-weight:500}
.setup details[open] summary{margin-block-end:10px}
#grab-code{inline-size:100%;block-size:84px;direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px;resize:none}
.shelf{display:grid;gap:12px}
#lesson-list{display:grid;gap:10px}
.lcard{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lcard-main{flex:1;min-inline-size:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;text-align:start;background:none;border:0;padding:10px 12px;cursor:pointer}
.thumb{inline-size:96px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:var(--prompter)}
.lcard-text{display:grid;gap:4px;min-inline-size:0}
.lcard-title{font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard-meta{color:var(--muted);font-size:.85rem}
.lbar{display:block;block-size:4px;background:var(--line);border-radius:2px;overflow:hidden}
.lbar i{display:block;block-size:100%;background:var(--mark)}
.lcard-del{border:0;border-inline-start:1px solid var(--line);background:none;color:var(--muted);padding:0 14px;cursor:pointer;font-size:.85rem}
.lcard-del.sure{color:var(--bad);font-weight:600}
.empty{color:var(--muted);margin:0}

/* ---------- Watch ---------- */
.watch{display:flex;flex-direction:column;gap:12px;block-size:calc(100dvh - 62px);padding-block-end:12px}
.side{flex:none;display:grid;gap:10px;align-content:start}
.vbox{position:relative;inline-size:min(100%,calc(42dvh * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#000;border-radius:14px;overflow:hidden}
.vbox iframe,.vbox #player{position:absolute;inset:0;inline-size:100%;block-size:100%;border:0}
.vmsg{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;padding:20px;color:#F4F6FB;background:#000}
.wtitle{margin:0;font-family:var(--font-ar);font-weight:600;font-size:1rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctrl .btn-mark{margin-inline-start:auto;padding:7px 20px}
.script{flex:1;min-block-size:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;padding:14px 12px 40vh}
.script.bare{padding:22px}
.line{padding:10px 14px;border-radius:12px;cursor:pointer;opacity:.4;transition:opacity .25s,background-color .25s}
.line.cur{opacity:1;background:var(--prompter-2)}
.l-en{margin:0;direction:ltr;text-align:left;font-family:var(--font-en);font-weight:500;font-size:clamp(1.25rem,1.05rem + .9vw,1.6rem);line-height:1.5;overflow-wrap:anywhere}
.w{border-radius:4px;padding:0 .06em}
.w.fn{text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,var(--mark) 75%,transparent);text-underline-offset:5px;text-decoration-thickness:2px}
.line.cur.kara .w{color:var(--prompter-muted)}
.line.cur.kara .w.said{color:var(--prompter-ink)}
.line.cur.kara .w.now{background:var(--mark);color:var(--mark-ink)}
.l-ar{margin:4px 0 0;color:var(--prompter-muted);font-size:1rem;line-height:1.7;min-block-size:0}
.line.cur .l-ar{color:#DCE2F0}
.no-ar .l-ar{display:none}
.need{display:grid;gap:14px;max-inline-size:560px}
.need h2{color:var(--prompter-ink)}
.need p{margin:0;color:#C9D1E3}
.need .btn{justify-self:start}
.need textarea{inline-size:100%;min-block-size:120px;background:var(--prompter-2);border:1px solid #33406A;border-radius:10px;color:var(--prompter-ink);padding:10px 12px;direction:ltr;text-align:left;font-family:var(--font-en);font-size:1.05rem}
.need details summary{cursor:pointer;color:#C9D1E3}
.need details[open] summary{margin-block-end:10px}
.need a.plain{color:var(--mark)}
.endbar{position:sticky;inset-block-end:0;margin-block-start:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--mark);color:var(--mark-ink);border-radius:12px;padding:10px 14px;font-weight:600}
.endbar .btn{border-color:var(--mark-ink);background:var(--mark-ink);color:var(--mark)}
@media (min-width:1000px) and (orientation:landscape){
  .watch{flex-direction:row;align-items:stretch;gap:18px}
  .side{flex:1.35;min-inline-size:0}
  .vbox{inline-size:min(100%,calc((100dvh - 190px) * 16 / 9))}
  .script{flex:1;padding-block-end:50vh}
}

/* word sheet */
.sheet{position:fixed;inset-inline:0;inset-block-end:0;z-index:20;margin:0 auto;max-inline-size:640px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-block-end:0;border-radius:18px 18px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(8,12,24,.28);display:grid;gap:10px}
.sh-en{margin:0;direction:ltr;text-align:left;font-family:var(--font-en);font-weight:600;font-size:2rem;line-height:1.2}
.sh-ar{margin:0;font-size:1.3rem;font-weight:500;min-block-size:1.75em}
.sh-note{margin:0;color:var(--muted);border-inline-start:4px solid var(--mark);padding-inline-start:12px}
.sh-act{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Study ---------- */
.study{max-inline-size:760px;margin:0 auto;display:grid;gap:16px;padding-block-start:6px}
.shead{display:grid;gap:8px}
.shead h1{font-family:var(--font-ar);font-weight:600;font-size:1.15rem;overflow-wrap:anywhere}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:.95rem}
.banner .live{display:flex;align-items:center;gap:10px}
.dot{inline-size:9px;block-size:9px;border-radius:50%;background:var(--mark);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.line{transition:none}.script{scroll-behavior:auto}}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.panel label{display:flex;align-items:center;gap:10px;cursor:pointer}
.panel input[type=checkbox],.opt-line input{inline-size:18px;block-size:18px;accent-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.opt-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;cursor:pointer}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;block-size:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;block-size:100%;background:var(--mark)}
.count{font-family:var(--font-en);font-variant-numeric:tabular-nums;color:var(--muted);font-size:1rem}
.stage{padding:28px 26px 18px;min-block-size:190px;display:grid;gap:20px;align-content:space-between}
.sent{margin:0;direction:ltr;text-align:left;font-family:var(--font-en);font-weight:500;font-size:clamp(1.45rem,1.1rem + 1.9vw,2.2rem);line-height:1.42;text-wrap:pretty;overflow-wrap:anywhere}
.sent mark,.q-en mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.listen{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{background:transparent;border:1px solid color-mix(in srgb,var(--prompter-ink) 30%,transparent);color:var(--prompter-ink);border-radius:999px;padding:5px 16px;font-size:.9rem;cursor:pointer}
.pbtn:focus-visible{outline-color:var(--mark)}
.reveal{inline-size:100%;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:22px 16px;color:var(--muted);cursor:pointer}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;gap:18px}
.tr{margin:0;font-size:1.2rem;line-height:1.85;font-weight:500}
.explain h3{margin:0 0 8px;font-size:.8rem;font-weight:600;color:var(--muted)}
.vocab{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));direction:ltr}
.vocab li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;position:relative}
.v-en{display:block;direction:ltr;text-align:left;font-family:var(--font-en);font-weight:600;font-size:1.12rem}
.v-ar{display:block;direction:rtl;text-align:right;color:var(--muted);font-size:.95rem}
.v-del{position:absolute;inset-block-start:4px;inset-inline-end:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;direction:rtl}
.g-en{display:block;inline-size:fit-content;margin-left:0;margin-right:auto;direction:ltr;background:var(--mark);color:var(--mark-ink);font-family:var(--font-en);font-weight:600;font-size:1.12rem;border-radius:6px;padding:0 12px}
.g-ar{margin:8px 0 0}
.stepnav{position:sticky;inset-block-end:0;display:flex;gap:10px;padding:12px 0 14px;background:linear-gradient(to top,var(--paper) 72%,transparent)}
.stepnav .btn{flex:1;padding:12px}
.quiz{display:grid;gap:16px}
.q-label{margin:0;color:var(--muted);font-size:.95rem}
.q-en{margin:0;direction:ltr;text-align:left;font-family:var(--font-en);font-size:clamp(1.3rem,1.1rem + 1vw,1.7rem);line-height:1.55;overflow-wrap:anywhere}
.gap{display:inline-block;min-inline-size:3.4em;border-block-end:3px solid var(--mark);text-align:center}
.q-word{margin:0;direction:ltr;text-align:left;font-family:var(--font-en);font-weight:600;font-size:2rem;line-height:1.3}
.q-ar{margin:0;font-size:1.15rem;font-weight:500}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;font-size:1.08rem}
.opt.en{font-family:var(--font-en);font-size:1.2rem}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.built,.bank{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.built{min-block-size:56px;border-block-end:2px solid var(--line);padding-block-end:8px;align-content:flex-start}
.wd{font-family:var(--font-en);font-size:1.15rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer}
.wd.used{visibility:hidden}
.fb{border:1px solid var(--line);border-inline-start-width:5px;border-radius:10px;padding:12px 16px;display:grid;gap:4px;background:var(--surface)}
.fb.ok{border-color:var(--good)}
.fb.no{border-color:var(--bad)}
.fb p{margin:0}
.fb strong{font-family:var(--font-head)}
.fb-en{display:block;direction:ltr;text-align:left;font-family:var(--font-en);font-size:1.2rem;font-weight:600}
.fb-tr{color:var(--muted)}
.result{display:grid;gap:12px;justify-items:start}
.score{margin:0;font-family:var(--font-en);font-weight:600;font-size:3.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
#toast{position:fixed;z-index:30;inset-block-end:18px;inset-inline:0;margin:0 auto;inline-size:fit-content;max-inline-size:calc(100% - 32px);background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 16px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="top">
  <button class="brand" data-a="home" aria-label="الرئيسية">مقطع <span class="hl">ودرس</span></button>
  <div id="topnav"></div>
</header>
<main id="app"></main>
<div id="sheet-host"></div>
<div id="toast" role="status" aria-live="polite"></div>

function markUp(s, only) {
  const text = s.en, ranges = [];
  (only ? [{ e: only }] : (s.v || [])).forEach(v => {
    if (!v.e || v.e.length < 2) return;
    const m = new RegExp('(^|[^A-Za-z])(' + escRe(v.e) + ')(?![A-Za-z])', 'i').exec(text);
    if (m) ranges.push([m.index + m[1].length, m.index + m[1].length + m[2].length]);
  });
  ranges.sort((a, b) => a[0] - b[0]);
  let out = '', p = 0;
  for (const r of ranges) { if (r[0] < p) continue; out += esc(text.slice(p, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>'; p = r[1]; }
  return out + esc(text.slice(p));
}

    }
    case 'open': { const x = S.lessons.find(k => k.id === el.dataset.id); if (x) openWatch(x); break; }
    case 'del': { const id = el.dataset.id; if (S.confirmDel === id) { S.confirmDel = ''; S.lessons = S.lessons.filter(k => k.id !== id); persist(); } else S.confirmDel = id; renderList(); break; }
    case 'copy-grab': {
      const code = bookmarklet(), msg = $('#copy-msg'), box = $('#grab-code');
      const fallback = () => { box.hidden = false; box.value = code; box.focus(); box.select(); msg.textContent = 'انسخ الكود من المربع يدوياً.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => { msg.textContent = 'انتسخ الكود. كمّل الخطوات.'; }, fallback); else fallback();
      break;
    }
    case 'watch': if (l) { S.view = 'watch'; render(); } break;
    case 'study': openStudy(); break;
    case 'replay': if (l && S.li >= 0) seekLine(S.li, true); break;
    case 't-stop': S.stopEach = !S.stopEach; S.release = false; el.setAttribute('aria-pressed', S.stopEach); break;
    case 't-slow': S.slow = !S.slow; el.setAttribute('aria-pressed', S.slow); try { if (player) player.setPlaybackRate(S.slow ? 0.75 : 1); } catch (x) { /* ignore */ } break;
    case 't-ar': S.showAr = !S.showAr; LS.set('mw2.showAr', S.showAr); el.setAttribute('aria-pressed', S.showAr); $('#script').classList.toggle('no-ar', !S.showAr); if (S.showAr && l) translateAhead(l, Math.max(0, S.li)); break;
    case 'paste': {
      const rows = parsePaste($('#f-paste').value);
      if (rows.reduce((n, r) => n + wordsOf(r[1]).length, 0) < 5) { $('#paste-msg').textContent = 'الصق نص المقطع بالإنجليزي أولاً.'; break; }
      l.body = makeBody(rows); l.ar = []; l.vocab = null; persist(); openWatch(l); break;
    }
    case 'sh-close': S.sheet = null; renderSheet(); break;
    case 'sh-resume': S.sheet = null; renderSheet(); try { if (player) player.playVideo(); } catch (x) { /* ignore */ } break;
    case 'sh-save': if (S.sheet && l && S.sheet.ar && !l.saved.some(x => x.e === S.sheet.w)) { l.saved.push({ e: S.sheet.w, a: S.sheet.ar }); S.sents = null; persist(); renderSheet(); } break;
    case 'unsave': l.saved.splice(+el.dataset.i, 1); S.sents = null; persist(); render(); break;
    case 'retry-prep': S.prepErr = ''; gtxFails = 0; mtBlockedUntil = 0; prepareStudy(l); break;
    case 'tab': S.tab = el.dataset.tab; if (S.tab === 'quiz' && (!S.quiz || !S.quiz.qs.length || S.quiz.i >= S.quiz.qs.length)) startQuiz(); render(); break;
    case 'prev': setIdx(S.idx - 1); break;
    case 'next': setIdx(S.idx + 1); break;
    case 'reveal': S.shown = true; render(); break;
    case 'say': case 'say-slow': { const s = sentsOf()[S.idx]; if (s) speak(s.en, a === 'say-slow'); break; }
    case 'from-clip': { const i = sentsOf()[S.idx].i; l.pos = l.lines[i].s; S.view = 'watch'; S.stopEach = true; render(); toast('اضغط تشغيل. يوقف بعد الجملة.'); break; }
    case 'pdf-open': S.pdf.open = !S.pdf.open; S.pdf.msg = ''; S.pdf.err = false; render(); break;
    case 'pdf-make': buildPdf(); break;
    case 'pdf-share': sharePdf(); break;
    case 'q-opt': if (q && Q.picked === null) { Q.picked = +el.dataset.i; if (q.options[Q.picked] === q.answer) Q.score++; render(); } break;
    case 'q-pick': if (q && Q.picked === null && !Q.built.includes(+el.dataset.i)) { Q.built.push(+el.dataset.i); render(); } break;
    case 'q-unpick': if (q && Q.picked === null) { Q.built.splice(+el.dataset.i, 1); render(); } break;
    case 'q-check': if (q && Q.picked === null) { const ok = Q.built.map(k => q.words[k]).join(' ') === q.answer; Q.picked = ok ? 'ok' : 'no'; if (ok) Q.score++; render(); } break;
    case 'q-next': if (Q) { Q.i++; Q.picked = null; Q.built = []; render(); } break;
    case 'q-restart': startQuiz(); render(); break;
  }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'opt-hide') { S.hideFirst = e.target.checked; LS.set('mw2.hideFirst', S.hideFirst); render(); }
  else if (id === 'pdf-lines') { S.pdf.lines = e.target.checked; S.pdf.file = null; render(); }
  else if (id === 'pdf-extra') { S.pdf.extra = e.target.checked; S.pdf.file = null; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f-url') { e.preventDefault(); const b = $('[data-a="go"]'); if (b) b.click(); return; }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view === 'study' && S.tab === 'step') { if (e.key === 'ArrowRight') setIdx(S.idx + 1); else if (e.key === 'ArrowLeft') setIdx(S.idx - 1); }
  else if (S.view === 'watch' && S.cur && S.cur.timed) { if (e.key === 'ArrowRight') seekLine(Math.min(S.cur.lines.length - 1, S.li + 1), true); else if (e.key === 'ArrowLeft') seekLine(Math.max(0, S.li - 1), true); }
});
['touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#script')) S.scrollHold = Date.now() + 4000; }, { passive: true }));
window.addEventListener('hashchange', importHash);
window.addEventListener('pagehide', persist);

/* ================= boot ================= */
if (!importHash()) render();
})();
</script>
</body>
